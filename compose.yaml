services:
  postgres:
    image: postgres:17-alpine
    container_name: jobpulse-postgres
    environment:
      POSTGRES_DB: jobpulse
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: jobpulse
    ports:
      - "5433:5432"
    volumes:
      - jobpulse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobpulse-postgres-data: