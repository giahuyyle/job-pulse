global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: jobpulse
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password: local-monitor-only
    static_configs:
      - targets:
          - host.docker.internal:8080
