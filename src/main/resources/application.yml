spring:
  application:
    name: jobpulse

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-unconfigured}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-unconfigured}
            scope: openid,email,profile

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/jobpulse}
    username: ${DATABASE_USER:jobpulse}
    password: ${DATABASE_PASSWORD:jobpulse}

  jpa:
    open-in-view: false # prevents database access from leaking into the HTTP response layer
    hibernate:
      ddl-auto: validate # prevent hibernate from silently changing schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway: # owns db migrations
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jobpulse}
    password: ${RABBITMQ_PASSWORD:jobpulse}
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: true
        observation-enabled: true
    template:
      observation-enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

jobpulse:
  admin:
    enabled: ${JOBPULSE_ADMIN_ENABLED:false}
  security:
    admin-emails: ${JOBPULSE_ADMIN_EMAILS:}
    monitor-password: ${JOBPULSE_MONITOR_PASSWORD:local-monitor-only}
  providers:
    greenhouse:
      base-url: ${GREENHOUSE_BASE_URL:https://boards-api.greenhouse.io}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jobpulse.search.duration: true
        jobpulse.ingestion.duration: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    com.huy.jobpulse: INFO

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
