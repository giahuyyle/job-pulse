spring:
  application:
    name: jobpulse

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/jobpulse}
    username: ${DATABASE_USER:jobpulse}
    password: ${DATABASE_PASSWORD:jobpulse}

  jpa:
    open-in-view: false # prevents database access from leaking into the HTTP response layer
    hibernate:
      ddl-auto: validate # prevent hibernate from silently changing schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway: # owns db migrations
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jobpulse}
    password: ${RABBITMQ_PASSWORD:jobpulse}
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080
  shutdown: graceful
