name: jobpulse

services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      JOBPULSE_DOMAIN: ${JOBPULSE_DOMAIN:?JOBPULSE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [edge]

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,observability
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobpulse
      DATABASE_USER: jobpulse
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: jobpulse
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      JOBPULSE_ADMIN_EMAILS: ${JOBPULSE_ADMIN_EMAILS:-}
      JOBPULSE_EMAIL_ENABLED: ${JOBPULSE_EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      JOBPULSE_EMAIL_FROM: ${JOBPULSE_EMAIL_FROM:-}
      JOBPULSE_APP_URL: https://${JOBPULSE_DOMAIN:?JOBPULSE_DOMAIN is required}
      JOBPULSE_EMAIL_DAILY_LIMIT: ${JOBPULSE_EMAIL_DAILY_LIMIT:-100}
      JOBPULSE_EMAIL_MONTHLY_LIMIT: ${JOBPULSE_EMAIL_MONTHLY_LIMIT:-3000}
      JOBPULSE_EMAIL_ALLOWLIST: ${JOBPULSE_EMAIL_ALLOWLIST:-}
      JOBPULSE_ADMIN_ENABLED: ${JOBPULSE_ADMIN_ENABLED:-false}
      JOBPULSE_MONITOR_PASSWORD: ${JOBPULSE_MONITOR_PASSWORD:?JOBPULSE_MONITOR_PASSWORD is required}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [edge, data]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpulse
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: jobpulse
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [data]

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/monitor-password:/etc/prometheus/monitor-password:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
    networks: [data]

  tempo:
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks: [data]

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks: [data]

networks:
  edge:
  data:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rabbitmq_data:
  kafka_data:
  prometheus_data:
  tempo_data:
  grafana_data:
